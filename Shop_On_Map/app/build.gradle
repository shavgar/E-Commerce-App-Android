apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.example.android.mymap"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets { main { java.srcDirs = ['src/main/java', 'src/main/java/2'] } }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.1.0-alpha04'
    implementation 'com.google.android.gms:play-services-maps:16.1.0'
    implementation 'com.google.android.gms:play-services-location:16.0.0'
    implementation 'com.google.android.gms:play-services-auth:16.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    /*Firebase dependencies*/
    implementation 'com.google.firebase:firebase-core:16.0.8'
    implementation 'com.google.firebase:firebase-auth:16.2.1'
    implementation 'com.google.firebase:firebase-database:16.1.0'
    implementation 'com.google.firebase:firebase-firestore:18.2.0'
    implementation 'com.google.firebase:firebase-storage:16.1.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0-alpha04'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0-alpha04'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0-alpha04'
    implementation 'jp.wasabeef:recyclerview-animators:2.2.3'
    implementation 'com.google.android.material:material:1.1.0-alpha05'
    implementation 'de.hdodenhof:circleimageview:3.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    /*enable multidex*/
    implementation 'androidx.multidex:multidex:2.0.1'

    /*library for more image features
    * okhttp loads the images loaded by Picasso when there is no interenet connection(offline)*/
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.squareup.okhttp3:okhttp:3.4.1'

    /*crop the images*/
    implementation 'com.theartofdev.edmodo:android-image-cropper:2.6.+'

    /*expandable textview*/
    implementation 'com.ms-square:expandableTextView:0.1.4'
    /*query users locations from database*/
    implementation 'com.firebase:geofire-android:2.3.1'

    /*carouselview*/
    implementation 'com.azoft.carousellayoutmanager:carousel:1.2.1'

    /*recyclerview placeholder content like facebook "shimmer library"*/
    implementation 'com.facebook.shimmer:shimmer:0.4.0'

    /*country phone codes picker */
    implementation 'com.hbb20:ccp:2.2.6'

    implementation 'com.google.maps.android:android-maps-utils:0.5+'


}

apply plugin: 'com.google.gms.google-services'

com.google.gms.googleservices.GoogleServicesPlugin.config.disableVersionCheck = true
